name: Release

# Publishes through RubyGems trusted publishing, which matches on this file's
# name and the `release` environment. The environment admits only `v*` tags.
on:
  push:
    tags: ['v*']

# No concurrency group: cancelling a publish mid-flight could leave it half
# done, and a group equal to CI's would make the reused CI cancel this run.
permissions:
  contents: read

jobs:
  # CI skips tag pushes, so this is the only run of lint and tests on the
  # tagged commit. It holds no id-token.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      # Exchanged for a short-lived RubyGems token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No bundle install, so no development gem runs in the job that can
      # publish. `gem build` loads the gemspec on its own.
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: .ruby-version
          bundler: none

      - name: Stamp the tag version into version.rb
        run: bin/stamp-version "${GITHUB_REF_NAME#v}" lib/opentelemetry/instrumentation/sqlite3/version.rb

      - name: Build gem
        run: gem build opentelemetry-instrumentation-sqlite3.gemspec

      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      # Pushing the file named for the tag means a build that disagrees with
      # the tag has nothing to push.
      - name: Push gem
        run: gem push "opentelemetry-instrumentation-sqlite3-${GITHUB_REF_NAME#v}.gem"
